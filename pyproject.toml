[project]
name = "ha-soundboks-integration"
version = "0.1.0"
description = "Home Assistant integration for SOUNDBOKS speakers over Bluetooth LE"
license = "MIT"
requires-python = ">=3.14.2"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# pyflakes/pycodestyle defaults, plus import sorting, bugbear, pyupgrade and async pitfalls
extend-select = ["I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
# Same pins as requirements-dev.txt (which CI and dependabot use), so `uv run pytest` works too
dev = [
    "pytest-homeassistant-custom-component==0.13.374",
    "aiousbwatcher==1.1.2",
    "serialx==1.14.0",
    "dbus-fast==5.2.0",
]
